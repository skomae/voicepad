name: VoicePad
options:
  bundleIdPrefix: com.voicepad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 1.1.1
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.4
targets:
  VoicePad:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - VoicePad
    dependencies:
      - target: VoicePadWidgets
        embed: true
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    info:
      path: VoicePad/Info.plist
      properties:
        CFBundleDisplayName: VoicePad
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: VoicePad records your voice as soon as it opens so it can transcribe what you say.
        UIBackgroundModes:
          - audio
        # Recording Live Activity (Lock Screen / Dynamic Island) with Stop and Split.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOICEPAD_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  VoicePadWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - VoicePadWidgets
      - VoicePad/Shared
    info:
      path: VoicePadWidgets/Info.plist
      properties:
        CFBundleDisplayName: VoicePad
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOICEPAD_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  VoicePadTests:
    type: bundle.unit-test
    platform: iOS
    # Compiles the pure model code directly (no host app), so tests never
    # launch the app, start recording or download a model.
    sources:
      - VoicePadTests
      - VoicePad/Models
      - VoicePad/Audio/WavFile.swift
      - VoicePad/Translation/LanguageTags.swift
      - VoicePad/Translation/Romanizer.swift
      - VoicePad/Translation/TranslationJoin.swift
      - VoicePad/Transcription/ChunkPlanner.swift
      - VoicePad/Transcription/AudioLevel.swift
      - VoicePad/Transcription/EngineChoice.swift
      - VoicePad/Conversation/Turns.swift
      - VoicePad/Conversation/Stage.swift
      - VoicePad/Conversation/ConversationLanguages.swift
      - VoicePad/Conversation/SpeakerClustering.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicepad.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VoicePad:
    build:
      targets:
        VoicePad: all
        VoicePadTests: [test]
    test:
      targets:
        - VoicePadTests
