name: Android

# - Pushes and PRs touching android/ build the APK and upload it as a
#   workflow artifact.
# - Pushing a tag like v0.2.0 (or running this workflow by hand with a
#   version) also publishes the APK to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android-release.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (creates tag v<version>)"
        required: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            name="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="0.0.0-ci.${{ github.run_number }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "VOICEPAD_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VOICEPAD_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Set up release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key and cannot be installed as an update over a differently signed build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "VOICEPAD_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "VOICEPAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "VOICEPAD_KEY_ALIAS=$KEY_ALIAS"
            echo "VOICEPAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          out="VoicePad-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "path=android/$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VoicePad-android-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: VoicePad ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Android APK for VoicePad ${{ steps.version.outputs.name }}. Download `VoicePad-${{ steps.version.outputs.name }}.apk` below and open it on your phone (allow installs from this source when asked).
            ${{ steps.signing.outputs.signed == 'false' && '> **Note:** this build is signed with a temporary debug key. Uninstall any earlier VoicePad build before installing it.' || '' }}
