voicepad.fr1.x0t.cc {
	root * /var/www/voicepad
	encode gzip zstd
	header -Server
	header X-Content-Type-Options nosniff
	header Referrer-Policy no-referrer
	@nocache path / /index.html /sw.js /manifest.webmanifest
	header @nocache Cache-Control "no-cache"
	@manifest path /manifest.webmanifest
	header @manifest Content-Type "application/manifest+json"
	@wasm path /ort/*.wasm /assets/*.wasm
	header @wasm Content-Type "application/wasm"
	@mjs path /ort/*.mjs /assets/*.mjs
	header @mjs Content-Type "text/javascript"
	@immutable path /assets/* /ort/*
	header @immutable Cache-Control "public, max-age=31536000, immutable"
	try_files {path} /index.html
	file_server
}
